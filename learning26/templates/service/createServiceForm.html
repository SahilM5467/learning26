{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="form-page">

    <div class="form-card">
        <h1>Create Service</h1>

        <a href="{% url 'serviceList' %}" class="back-link">← Service List</a>

        <form method="POST" novalidate>
            {% csrf_token %}

            <div class="form-fields">
                {{ form|crispy }}
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

</div>

{% endblock content %}
