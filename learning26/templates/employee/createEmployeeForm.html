{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="form-page">

    <div class="form-card">
        <h1>Create Employee</h1>

        <a href="{% url 'employeeList' %}" class="back-link">← Employee List</a>

        <form method="POST">
            {% csrf_token %}

            <div class="form-fields">
                {{ form|crispy }}
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

</div>
{% endblock content %}
